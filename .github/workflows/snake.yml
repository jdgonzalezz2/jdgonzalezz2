name: 🐍 Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'   # Diariamente a medianoche UTC
  workflow_dispatch:        # Puede dispararse manualmente desde Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      # svg-only: variante ligera de Platane/snk, lee el grafo público de contribuciones
      # No requiere GITHUB_TOKEN propio — usa el del runner automáticamente
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # crazy-max/ghaction-github-pages: maneja correctamente el push a un branch separado
      # Equivale a hacer un git push --force al branch 'output' con solo el contenido de dist/
      - name: Deploy SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
